[project]
name = "battery-eta-outages"
version = "0.1.0"
description = "Collects planned power outage schedules for the Battery ETA app"
requires-python = ">=3.13"
dependencies = [
    "ukraine-energy-monitor @ git+https://github.com/fastiuk/ukraine-energy-monitor@v0.5.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
